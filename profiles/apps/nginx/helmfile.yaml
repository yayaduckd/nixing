repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: nginx
    namespace: nginx
    createNamespace: true
    chart: bitnami/nginx
    values:
      - ingress:
          enabled: true
          ingressClassName: traefik
          hostname: beak.yayaduck.com
        nodeSelector:
          kubernetes.io/hostname: duckweb-wings
